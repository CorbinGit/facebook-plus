name: Apply patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply and commit
        run: |
          git apply --index hold-to-download.patch
          rm hold-to-download.patch
          git rm --cached -q hold-to-download.patch || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -am "Apply hold-to-download patch"
          git push
